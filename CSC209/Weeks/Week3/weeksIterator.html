<!DOCTYPE html>
<head>
    <title>Week Iterator</title>
    <script>
        const NRWEEKS=10;
        const WEEK ="<h1>Week NRWEEK</h1>";
        const WEEKARR=["sep 1-7", "Sep 8-14"];

    </script>
</head>
<body>
    <script>
    for(let i=1; i<=NRWEEKS;i++){
        var crtWeekTitle = WEEK.replace("NRWEEK","" + i);
        var crtWeekDate = DATE.replace("DATE", WEEKARR[i+1]);
        var crtWeekTopic = TOPIC.replace("TOPIC",LISTTOPICS[i-1]);
        var crtWeekDesc = DESC.replace("DESC", LISTDESC[i-1]);
        var main = crtWeekTitle + crtWeekDate + crtWeekTopic + crtWeekDesc;
    } 
        </script>
</body>
