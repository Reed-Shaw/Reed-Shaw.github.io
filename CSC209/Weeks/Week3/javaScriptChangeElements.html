<!DOCTYPE html>
<html>
    <body>

        <a href="../Week3/">Back to Week 3</a>

        <h2>What Can JavaScript Do?</h2>

        <p id="styleMe">JavaScript can change the style of an HTML element.</p>

        <button type="button" onclick="document.getElementById('styleMe').style.fontSize='35px'">Click Me!</button>

        <p id="hideMe">JavaScript can hide HTML elements.</p>

        <button type="button" onclick="document.getElementById('hideMe').style.display='none'">Click Me!</button>

        <p>JavaScript can show hidden HTML elements.</p>

        <p id="showMe" style="display:none">Hello JavaScript!</p>

        <button type="button" onclick="document.getElementById('showMe').style.display='block'">Click Me!</button>



    </body>
</html>
